<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>出库管理 - 库存管理系统</title></head>
<body>
<section>
    <div class="page-head">
        <div><h1>出库管理</h1><p>出库采用数据库原子条件更新，库存不足时拒绝，杜绝超卖与负库存</p></div>
        <a class="btn btn-out" th:href="@{/stock/out/new}"><svg th:replace="~{fragments/icons :: ic('plus')}"></svg>新建出库单</a>
    </div>
    <div class="card">
        <div class="card-head">
            <form class="filters" method="get" th:action="@{/stock/out}">
                <select class="input" name="productId" aria-label="按商品筛选">
                    <option value="">全部商品</option>
                    <option th:each="pd : ${products}" th:value="${pd.id}" th:text="${pd.code + ' ' + pd.name}"
                            th:selected="${productId != null and productId == pd.id}"></option>
                </select>
                <button class="btn btn-light" type="submit">筛选</button>
            </form>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead><tr><th>出库单号</th><th>时间</th><th>商品</th><th class="num">数量</th><th>去向/客户</th>
                    <th class="num">库存变化</th><th>操作人</th><th>备注</th></tr></thead>
                <tbody>
                <tr th:each="o : ${page.content}">
                    <td class="mono" th:text="${o.orderNo}"></td>
                    <td class="tnum" th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td><a th:href="@{/products/{id}(id=${o.product.id})}" th:text="${o.product.name}"></a></td>
                    <td class="num delta-out" th:text="${'−' + o.quantity}"></td>
                    <td th:text="${o.customer ?: '—'}"></td>
                    <td class="num change"><span th:text="${o.beforeStock}"></span><svg th:replace="~{fragments/icons :: ics('arrow-right')}"></svg><span th:text="${o.afterStock}"></span></td>
                    <td th:text="${o.operator}"></td>
                    <td th:text="${o.remark ?: ''}"></td>
                </tr>
                <tr th:if="${page.totalElements == 0}"><td colspan="8" class="empty"><svg th:replace="~{fragments/icons :: ic('outbound')}"></svg><b>还没有出库单</b>出库时库存不足会被直接拒绝，不会产生负库存<br><a class="btn btn-out btn-sm" th:href="@{/stock/out/new}">新建出库单</a></td></tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/pager :: pager(${page})}"></div>
    </div>
</section>
</body>
</html>
