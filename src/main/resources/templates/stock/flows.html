<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>库存流水 - 库存管理系统</title></head>
<body>
<section>
    <div class="page-head">
        <div><h1>库存流水</h1><p>每一次库存变动都对应一条流水，记录变动前后库存与关联单据</p></div>
    </div>
    <div class="card">
        <div class="card-head">
            <form class="filters" method="get" th:action="@{/flows}">
                <select class="input" name="productId" aria-label="按商品筛选">
                    <option value="">全部商品</option>
                    <option th:each="pd : ${products}" th:value="${pd.id}" th:text="${pd.code + ' ' + pd.name}"
                            th:selected="${productId != null and productId == pd.id}"></option>
                </select>
                <select class="input" name="type" aria-label="按类型筛选">
                    <option value="">全部类型</option>
                    <option value="IN" th:selected="${type != null and type.name() == 'IN'}">入库</option>
                    <option value="OUT" th:selected="${type != null and type.name() == 'OUT'}">出库</option>
                </select>
                <button class="btn btn-light" type="submit">筛选</button>
                <a class="btn btn-ghost" th:href="@{/flows}">重置</a>
            </form>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead><tr><th>流水号</th><th>时间</th><th>商品</th><th>类型</th><th class="num">数量</th>
                    <th class="num">变动前</th><th class="num">变动后</th><th>关联单据</th><th>操作人</th></tr></thead>
                <tbody>
                <tr th:each="f : ${page.content}">
                    <td class="tnum muted" th:text="${f.id}"></td>
                    <td class="tnum" th:text="${#temporals.format(f.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td class="name"><a th:href="@{/products/{id}(id=${f.product.id})}" th:text="${f.product.name}"></a><div class="mono" th:text="${f.product.code}"></div></td>
                    <td><span class="badge" th:classappend="${f.changeType.name() == 'IN'} ? 'badge-green' : 'badge-amber'" th:text="${f.changeType.label}"></span></td>
                    <td class="num" th:classappend="${f.changeType.name() == 'IN'} ? 'delta-in' : 'delta-out'" th:text="${(f.changeType.name() == 'IN' ? '+' : '−') + f.quantity}"></td>
                    <td class="num tnum" th:text="${f.beforeStock}"></td>
                    <td class="num tnum" th:text="${f.afterStock}"></td>
                    <td class="mono" th:text="${f.refOrderNo}"></td>
                    <td th:text="${f.operator}"></td>
                </tr>
                <tr th:if="${page.totalElements == 0}"><td colspan="9" class="empty"><svg th:replace="~{fragments/icons :: ic('flows')}"></svg><b>没有符合条件的流水</b>换个商品或类型再筛选</td></tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/pager :: pager(${page})}"></div>
    </div>
</section>
</body>
</html>
