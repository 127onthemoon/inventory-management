<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>分类编辑 - 库存管理系统</title></head>
<body>
<section>
    <div class="page-head">
        <div><h1 th:text="${form.id == null} ? '新增分类' : '编辑分类'">新增分类</h1></div>
        <a class="btn btn-light" th:href="@{/categories}"><svg th:replace="~{fragments/icons :: ic('back')}"></svg>返回列表</a>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/categories/save}" th:object="${form}" method="post" data-once>
                <input type="hidden" th:field="*{id}">
                <div class="form-grid">
                    <div class="field">
                        <label for="name">分类名称<span class="req">*</span></label>
                        <input class="input" th:field="*{name}" th:errorclass="invalid">
                        <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="field full">
                        <label for="description">描述</label>
                        <textarea class="input" rows="3" th:field="*{description}"></textarea>
                        <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">保存</button>
                    <a class="btn btn-light" th:href="@{/categories}">取消</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
