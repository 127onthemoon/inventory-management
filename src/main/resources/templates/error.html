<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>出错了 - 库存管理系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="content">
    <div class="card error-page">
        <div class="code" th:text="${status}">500</div>
        <h2 th:text="${status == 404} ? '页面不存在' : '系统繁忙，请稍后再试'">出错了</h2>
        <p class="hint" th:text="${path}"></p>
        <a class="btn" th:href="@{/}">返回首页</a>
    </div>
</div>
</body>
</html>
