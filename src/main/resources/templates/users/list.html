<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>用户管理 - 库存管理系统</title></head>
<body>
<section>
    <div class="page-head">
        <div><h1>用户管理</h1><p>管理员：全部权限；操作员：出入库作业与查询，不能维护基础资料和用户</p></div>
        <a class="btn" th:href="@{/users/new}"><svg th:replace="~{fragments/icons :: ic('plus')}"></svg>新增用户</a>
    </div>
    <div class="card">
        <div class="table-wrap">
            <table class="table">
                <thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td class="tnum muted" th:text="${u.id}"></td>
                    <td class="mono" th:text="${u.username}"></td>
                    <td th:text="${u.realName}"></td>
                    <td><span class="badge" th:classappend="${u.role.name() == 'ADMIN'} ? 'badge-blue' : 'badge-gray'" th:text="${u.role.label}"></span></td>
                    <td><span class="badge" th:classappend="${u.enabled} ? 'badge-green' : 'badge-red'" th:text="${u.enabled} ? '启用' : '禁用'"></span></td>
                    <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td><div class="row-actions">
                        <a class="btn-link" th:href="@{/users/{id}/edit(id=${u.id})}">编辑</a>
                        <form class="inline" method="post" th:action="@{/users/{id}/toggle(id=${u.id})}"
                              th:attr="data-confirm=${u.enabled} ? '确定禁用该用户吗？' : '确定启用该用户吗？'">
                            <button class="btn-link" th:classappend="${u.enabled} ? 'danger'" type="submit" th:text="${u.enabled} ? '禁用' : '启用'"></button>
                        </form>
                    </div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
